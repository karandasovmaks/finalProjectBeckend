version: '3.3'
services:
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: ok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1240562Na
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: postgressfinalproject
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ok
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1240562Na